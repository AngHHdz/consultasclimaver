name: Scrape clima
on:
  schedule: [{ cron: "*/30 * * * *" }]
  workflow_dispatch:
  push:
    paths:
      - "scraper.js"
      - ".github/workflows/scrape.yml"
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - name: Actualizar buques automotrices MEDI-PORT
        run: node scrape-buques.js
      - name: Actualizar clima y bitácora
        run: npm install && npm run scrape
        continue-on-error: true
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json data.js bitacora.json buques-autos.json
          git diff --cached --quiet || (git commit -m "update clima" && git push)
