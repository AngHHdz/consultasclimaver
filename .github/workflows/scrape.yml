name: Scrape clima y operaciones portuarias
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "scraper.js"
      - "scrape-buques.js"
      - ".github/workflows/scrape.yml"
permissions:
  contents: write
concurrency:
  group: scrape-portuario
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install
      - name: Consultar clima, bitácora, CALT y buques automotrices MEDI-PORT
        run: npm run scrape
      - name: Publicar datos actualizados
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json data.js bitacora.json buques-autos.json
          git diff --cached --quiet || (git commit -m "update clima y operaciones portuarias" && git push)
