name: Scrape clima y operaciones portuarias
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "scraper.js"
      - "scrape-buques.js"
      - ".github/workflows/scrape.yml"
permissions:
  contents: write
concurrency:
  group: scrape-portuario
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install
      # Cada fuente corre por separado: si una falla (p. ej. Open-Meteo) las demás se publican igual.
      - name: Consultar clima, bitácora y CALT
        continue-on-error: true
        run: npm run scrape
      - name: Consultar buques automotrices MEDI-PORT
        continue-on-error: true
        run: node scrape-buques.js
      - name: Publicar datos actualizados
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json data.js bitacora.json buques-autos.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "update clima y operaciones portuarias"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep 5
          done
          exit 1
